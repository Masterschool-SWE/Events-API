name: CI - Docker Build & Pytest

on:
  push:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

# TODO:
# Health Check
# Pipeline lokal ausführen
# merge main unterbinden, wenn Tests fehl schlagen
#
#
#

      - name: Show available tools
        run: |
          uname -a
          python3 --version
          pip3 --version || true
          which docker git curl jq gh
          ls -la /opt/hostedtoolcache/Python 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: check checkout
        run: ls -lisa

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          if ! docker build -t app-test:${{ github.sha }} .; then
            echo "::error::Docker-Image-Build ist fehlgeschlagen (Commit ${{ github.sha }})."
            exit 1
          fi

      - name: Health check containerized API
        run: |
          docker run -d --name api-healthcheck-${{ github.sha }} -p 5000:5000 app-test:${{ github.sha }}
          trap "docker rm -f api-healthcheck-${{ github.sha }} 2>/dev/null || true" EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health; then
              echo ""
              exit 0
            fi
            sleep 0.5
          done

          echo "::error::Containerisierte API auf /api/health nicht erreichbar."
          docker logs api-healthcheck-${{ github.sha }} || true
          exit 1

      - name: Run test_models.py inside Docker container
        run: |
          if ! docker run --rm app-test:${{ github.sha }} pytest ./tests/test_models.py; then
            echo "::error::pytest für ./tests/test_models.py im Docker-Container ist fehlgeschlagen."
            exit 1
          fi

      - name: Run API tests
        run: |
          docker run --rm --entrypoint "" app-test:${{ github.sha }} sh -c '
            flask run --host=127.0.0.1 --port=5000 &
            SERVER_PID=$!
            trap "kill $SERVER_PID 2>/dev/null || true" EXIT

            for i in $(seq 1 30); do
              if python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/api/health\")" 2>/dev/null; then
                break
              fi
              sleep 0.5
            done

            pytest ./tests/test_api.py
          '

      - name: cleanup
        if: always()
        run: |
          docker rmi app-test:${{ github.sha }} 2>/dev/null || true
          docker image prune -f
